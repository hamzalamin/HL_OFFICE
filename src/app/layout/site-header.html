@let t = lang.t();
<a class="skip-link" href="#main">{{ t.site.skipToContent }}</a>

<header class="header">
  <a class="brand" [routerLink]="lang.path('/')" [attr.title]="t.site.overview">
    <span class="brand-mark" aria-hidden="true">
      @if (initials()) {
        {{ initials() }}
      } @else {
        <svg viewBox="0 0 24 24">
          <path d="M12 2.5l8.5 4.9v9.2L12 21.5l-8.5-4.9V7.4z" class="cube-top" />
          <path d="M12 12v9.5l-8.5-4.9V7.4z" class="cube-left" />
          <path d="M12 12v9.5l8.5-4.9V7.4z" class="cube-right" />
        </svg>
      }
    </span>
    <span class="brand-name">{{ brand() }}</span>
    <span class="visually-hidden"> — {{ t.site.overview }}</span>
  </a>

  <div class="actions">
    <div class="directory">
      <button
        #toggle
        type="button"
        class="btn btn-ghost directory-btn"
        [attr.aria-expanded]="directoryOpen()"
        aria-controls="office-directory"
        (click)="directoryOpen.set(!directoryOpen())"
      >
        <app-icon name="compass" />
        <span class="directory-label">{{ t.site.directory }}</span>
      </button>
      <div id="office-directory" class="directory-menu" [class.is-open]="directoryOpen()" [attr.inert]="directoryOpen() ? null : ''">
        <p class="directory-hint">{{ t.site.directoryHint }}</p>
        <nav [attr.aria-label]="t.office.mapLabel">
          <app-office-directory />
        </nav>
      </div>
    </div>

    <a
      class="lang-switch"
      [routerLink]="lang.switchUrl(lang.lang() === 'en' ? 'fr' : 'en')"
      [attr.hreflang]="lang.lang() === 'en' ? 'fr' : 'en'"
      [attr.lang]="lang.lang() === 'en' ? 'fr' : 'en'"
      [attr.title]="t.site.otherLanguage"
    >
      <app-icon name="globe" />
      <span class="lang-code">{{ lang.lang() === 'en' ? 'FR' : 'EN' }}</span>
      <span class="visually-hidden">{{ t.site.otherLanguage }}</span>
    </a>
    <a class="btn btn-primary cv-btn" [routerLink]="lang.path(cvPath)" routerLinkActive="is-active" ariaCurrentWhenActive="location">
      <app-icon name="file" />
      {{ t.site.cv }}
    </a>
  </div>
</header>
